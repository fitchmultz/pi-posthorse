name: Pi

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Pull requests can restore native checkers that the default branch saved.
    paths:
      - patches/**
      - scripts/setup-*.ts
      - scripts/release-quality-controls.sh
      - .github/workflows/ci.yml
      - .github/workflows/release-qualification.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      source-ref:
        description: Exact candidate commit; blank uses the caller commit
        type: string
        default: ""
      release-source:
        description: Original main commit represented by the candidate
        type: string
        default: ""
      candidate-artifact:
        description: Same-run retained npm candidate; blank qualifies source normally
        type: string
        default: ""
      fork-artifact:
        description: Same-run retained fork; blank builds the resolved fork
        type: string
        default: ""
      official-version:
        description: Official stable version resolved for this run; blank resolves latest
        type: string
        default: ""
      fork-ref:
        description: Maintained fork commit resolved for this run; blank resolves main
        type: string
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  group: pi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PI_AUTOMATION_REF: 298709b018a4d99fe4eb4905647410ffdf193518 # main
  GO_VERSION: "1.27.1"
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  quality:
    name: Strict code quality
    uses: ./.github/workflows/release-qualification.yml
    with:
      source-ref: ${{ inputs.source-ref || github.sha }}

  resolve:
    uses: fitchmultz/.github/.github/workflows/resolve-hosts.yml@298709b018a4d99fe4eb4905647410ffdf193518 # main
    with:
      automation-ref: 298709b018a4d99fe4eb4905647410ffdf193518 # main
      official-version: ${{ inputs.official-version }}
      fork-ref: ${{ inputs.fork-ref }}

  qualify:
    needs: resolve
    if: ${{ !cancelled() }}
    name: Pi ${{ matrix.host }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        host: [official, fork]
    steps:
      - name: Use a job-private compilation cache
        run: printf 'npm_config_cache=%s/npm-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Require resolved latest hosts
        env:
          RESOLVE: ${{ needs.resolve.result }}
        run: test "$RESOLVE" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: extension
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - name: Verify candidate source
        env:
          SOURCE_REF: ${{ inputs.source-ref || github.sha }}
        run: test "$(git -C extension rev-parse HEAD)" = "$SOURCE_REF"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/.github
          ref: ${{ env.PI_AUTOMATION_REF }}
          path: automation
          persist-credentials: false
      - if: matrix.host == 'fork' && inputs.fork-artifact == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: fork
        with:
          repository: fitchmultz/pi
          ref: ${{ needs.resolve.outputs.fork-ref }}
          path: fork
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          check-latest: true
          package-manager-cache: false
      - name: Lockfile resolves only from the public npm registry
        working-directory: extension
        run: |
          ! grep '"resolved": "' package-lock.json | grep -v '"resolved": "https://registry.npmjs.org/'
      - name: Install native test prerequisites
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fd-find ripgrep attr
      - if: matrix.host == 'fork' && inputs.fork-artifact == ''
        name: Use the reviewed npm version
        run: npm install --global "$(node -p 'require("./automation/package.json").packageManager')"
      - if: matrix.host == 'fork' && inputs.fork-artifact == ''
        name: Build the current fork
        working-directory: fork
        env:
          PI_FORK_REF: ${{ steps.fork.outputs.commit }}
        run: |
          npm ci --ignore-scripts --no-audit
          npm run hydrate:model-data
          PI_OFFLINE=1 PI_TELEMETRY=0 npm run build:offline
          git diff --exit-code
          node ../automation/scripts/pack-fork.mjs . "$RUNNER_TEMP/fork-package" "$PI_FORK_REF"
          git diff --exit-code
      - if: matrix.host == 'fork' && inputs.fork-artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.fork-artifact }}
          path: ${{ runner.temp }}/fork-package
      - name: Use the extension npm version
        run: npm install --global "$(node -p 'require("./extension/package.json").packageManager')"
      - if: inputs.candidate-artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.candidate-artifact }}
          path: ${{ runner.temp }}/npm-candidate
      - if: inputs.candidate-artifact != ''
        name: Verify the retained candidate
        env:
          SOURCE_REF: ${{ inputs.source-ref }}
          RELEASE_SOURCE: ${{ inputs.release-source }}
          OFFICIAL_VERSION: ${{ needs.resolve.outputs.official-version }}
          FORK_REF: ${{ needs.resolve.outputs.fork-ref }}
        run: |
          node automation/scripts/npm-release.mjs verify \
            --artifact "$RUNNER_TEMP/npm-candidate" --source-ref "$SOURCE_REF" \
            --release-source "$RELEASE_SOURCE" --official-version "$OFFICIAL_VERSION" --fork-ref "$FORK_REF"
      # Same keys as the strict quality job; a miss builds inside isolated qualification.
      - name: Restore corrected native Oxlint
        id: oxlint
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/npm-cache/pi-quality-engine/oxlint
          key: oxlint-${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('extension/patches/oxlint-*.patch', 'extension/scripts/setup-oxlint-engine.ts') }}
      - name: Restore corrected tsgolint
        id: tsgolint
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/npm-cache/pi-quality-engine/tsgolint
          key: tsgolint-${{ runner.os }}-${{ runner.arch }}-go-${{ env.GO_VERSION }}-${{ hashFiles('extension/patches/tsgolint-*.patch', 'extension/scripts/setup-quality-engine.ts') }}
      - if: steps.tsgolint.outputs.cache-hit != 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - if: steps.oxlint.outputs.cache-hit != 'true'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: llvm-tools
          cache: false
          override: true
          rustflags: ""
      - if: steps.oxlint.outputs.cache-hit != 'true'
        name: Keep Rust available with isolated HOME
        run: |
          sysroot="$(rustc --print sysroot)"
          printf '%s\n' "$sysroot/bin" >> "$GITHUB_PATH"
      - name: Report native build storage
        run: |
          df -hT /tmp /var/tmp "$RUNNER_TEMP"
          findmnt -T /tmp
          findmnt -T /var/tmp
      - run: npm ci --ignore-scripts --no-audit
        working-directory: extension
      - if: matrix.host == 'official'
        name: Qualify official Pi
        env:
          GH_TOKEN: ${{ github.token }}
          version: ${{ needs.resolve.outputs.official-version }}
        run: |
          node automation/scripts/qualify.mjs \
            --repo pi-posthorse --source "$GITHUB_WORKSPACE/extension" \
            --host official --target "$version" --output "$RUNNER_TEMP/posthorse-official"
      - if: matrix.host == 'fork'
        name: Qualify fork Pi
        env:
          PI_COMPAT_FORK_REF: ${{ needs.resolve.outputs.fork-ref }}
        run: |
          node automation/scripts/qualify.mjs \
            --repo pi-posthorse --source "$GITHUB_WORKSPACE/extension" \
            --host fork --target "$RUNNER_TEMP/fork-package" --output "$RUNNER_TEMP/posthorse-fork"
      - if: inputs.candidate-artifact != ''
        name: Match the qualified package and host to the retained candidate
        env:
          HOST: ${{ matrix.host }}
        run: |
          node extension/scripts/verify-retained-qualification.ts \
            "$RUNNER_TEMP/npm-candidate/release.json" "$RUNNER_TEMP/posthorse-$HOST/qualification.json" "$HOST"
      - name: Hash retained qualification fixtures
        if: always()
        env:
          EVIDENCE: ${{ runner.temp }}/posthorse-${{ matrix.host }}
        run: |
          if test -d "$EVIDENCE/probes/contracts"; then
            cd "$EVIDENCE"
            find probes/contracts -type f -print0 | sort -z | xargs -0 -r sha256sum > fixture-sha256sums.txt
          fi
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-qualification-${{ matrix.host }}
          path: ${{ runner.temp }}/posthorse-${{ matrix.host }}
          if-no-files-found: error
          retention-days: 3
