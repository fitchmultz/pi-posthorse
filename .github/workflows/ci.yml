name: Pi

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ci.yml
      - index.ts
      - ui.ts
      - package.json
      - package-lock.json
      - tsconfig.json
      - scripts/**
      - test/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-${{ github.ref }}
  cancel-in-progress: true

env:
  PI_AUTOMATION_REF: bbc0048a363444cde7890c09e80cea00a47fc463 # fitchmultz/.github#33: dual-host Posthorse

jobs:
  verify:
    name: Pi fork and official
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: extension
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/.github
          ref: ${{ env.PI_AUTOMATION_REF }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: fork
        with:
          repository: fitchmultz/pi
          ref: main
          path: fork
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          check-latest: true
          package-manager-cache: false
      - name: Lockfile resolves only from the public npm registry
        working-directory: extension
        run: |
          ! grep '"resolved": "' package-lock.json | grep -v '"resolved": "https://registry.npmjs.org/'
      - name: Select supported fork target
        id: fork-support
        run: |
          version="$(node -p 'require("./fork/packages/coding-agent/package.json").version')"
          supported="$(node -e 'console.log(Number(process.argv[1].split(".")[0]) >= 1)' "$version")"
          echo "supported=$supported" >> "$GITHUB_OUTPUT"
          if [ "$supported" != true ]; then
            echo "Fork $version is below Posthorse's Pi 1.0 floor; fork qualification is unattempted until a supported candidate exists." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Use the reviewed npm version
        run: npm install --global "$(node -p 'require("./automation/package.json").packageManager')"
      - name: Install native test prerequisites
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fd-find ripgrep attr
      - name: Build the current fork
        if: steps.fork-support.outputs.supported == 'true'
        working-directory: fork
        env:
          PI_FORK_REF: ${{ steps.fork.outputs.commit }}
        run: |
          npm ci --ignore-scripts --no-audit
          npm run hydrate:model-data
          PI_OFFLINE=1 PI_TELEMETRY=0 npm run build:offline
          git diff --exit-code
          node ../automation/scripts/pack-fork.mjs . "$RUNNER_TEMP/fork-package" "$PI_FORK_REF"
          git diff --exit-code
      - name: Use the extension npm version
        run: npm install --global "$(node -p 'require("./extension/package.json").packageManager')"
      - run: npm ci --ignore-scripts --no-audit
        working-directory: extension
      - name: Qualify official Pi
        run: |
          version="$(node -p 'require("./extension/package.json").devDependencies["@earendil-works/pi-coding-agent"]')"
          env -u GITHUB_STEP_SUMMARY node automation/scripts/qualify.mjs \
            --repo pi-posthorse --source "$GITHUB_WORKSPACE/extension" \
            --host official --target "$version" --output "$RUNNER_TEMP/posthorse-official"
      - name: Qualify fork Pi
        if: steps.fork-support.outputs.supported == 'true'
        env:
          PI_COMPAT_FORK_REF: ${{ steps.fork.outputs.commit }}
        run: |
          env -u GITHUB_STEP_SUMMARY node automation/scripts/qualify.mjs \
            --repo pi-posthorse --source "$GITHUB_WORKSPACE/extension" \
            --host fork --target "$RUNNER_TEMP/fork-package" --output "$RUNNER_TEMP/posthorse-fork"
