name: Pi

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      official-version:
        description: Official stable version resolved for this run; blank resolves latest
        type: string
        default: ""
      fork-ref:
        description: Maintained fork commit resolved for this run; blank resolves main
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: pi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PI_AUTOMATION_REF: e34d8127d7b4d44647003ae1ab0a568775e0864c # main

jobs:
  quality:
    name: Strict code quality
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Use a job-private compilation cache
        run: printf 'npm_config_cache=%s/npm-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          check-latest: true
          package-manager-cache: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.1"
          cache: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: "1.99.0"
          components: llvm-tools
          cache: false
          override: true
          rustflags: ""
      - name: Use the repository npm version
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: Install native test prerequisites
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fd-find ripgrep attr
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run verify
      - name: Archive verified native checkers
        run: tar -czf "$RUNNER_TEMP/native-checkers.tar.gz" -C "$npm_config_cache" pi-quality-engine
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: posthorse-native-checkers
          path: ${{ runner.temp }}/native-checkers.tar.gz
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  resolve:
    uses: fitchmultz/.github/.github/workflows/resolve-hosts.yml@e34d8127d7b4d44647003ae1ab0a568775e0864c # main
    with:
      automation-ref: e34d8127d7b4d44647003ae1ab0a568775e0864c # main
      official-version: ${{ inputs.official-version }}
      fork-ref: ${{ inputs.fork-ref }}

  verify:
    needs: [resolve, quality]
    if: ${{ !cancelled() }}
    name: Pi fork and official
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Use a job-private compilation cache
        run: printf 'npm_config_cache=%s/npm-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Require resolved latest hosts
        env:
          RESOLVE: ${{ needs.resolve.result }}
          QUALITY: ${{ needs.quality.result }}
        run: test "$RESOLVE" = success && test "$QUALITY" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: extension
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/.github
          ref: ${{ env.PI_AUTOMATION_REF }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: fork
        with:
          repository: fitchmultz/pi
          ref: ${{ needs.resolve.outputs.fork-ref }}
          path: fork
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          check-latest: true
          package-manager-cache: false
      - name: Lockfile resolves only from the public npm registry
        working-directory: extension
        run: |
          ! grep '"resolved": "' package-lock.json | grep -v '"resolved": "https://registry.npmjs.org/'
      - name: Use the reviewed npm version
        run: npm install --global "$(node -p 'require("./automation/package.json").packageManager')"
      - name: Install native test prerequisites
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fd-find ripgrep attr
      - name: Build the current fork
        working-directory: fork
        env:
          PI_FORK_REF: ${{ steps.fork.outputs.commit }}
        run: |
          npm ci --ignore-scripts --no-audit
          npm run hydrate:model-data
          PI_OFFLINE=1 PI_TELEMETRY=0 npm run build:offline
          git diff --exit-code
          node ../automation/scripts/pack-fork.mjs . "$RUNNER_TEMP/fork-package" "$PI_FORK_REF"
          git diff --exit-code
      - name: Use the extension npm version
        run: npm install --global "$(node -p 'require("./extension/package.json").packageManager')"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.1"
          cache: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: "1.99.0"
          components: llvm-tools
          cache: false
          override: true
          rustflags: ""
      - name: Keep Rust available with isolated HOME
        run: |
          sysroot="$(rustc --print sysroot)"
          printf '%s\n' "$sysroot/bin" >> "$GITHUB_PATH"
      - name: Report native build storage
        run: |
          df -hT /tmp /var/tmp "$RUNNER_TEMP"
          findmnt -T /tmp
          findmnt -T /var/tmp
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: posthorse-native-checkers
          path: ${{ runner.temp }}/native-checkers
      - name: Restore verified native checkers
        run: |
          mkdir -p "$npm_config_cache"
          tar -xzf "$RUNNER_TEMP/native-checkers/native-checkers.tar.gz" -C "$npm_config_cache"
      - run: npm ci --ignore-scripts --no-audit
        working-directory: extension
      - name: Qualify official Pi
        env:
          version: ${{ needs.resolve.outputs.official-version }}
        run: |
          node automation/scripts/qualify.mjs \
            --repo pi-posthorse --source "$GITHUB_WORKSPACE/extension" \
            --host official --target "$version" --output "$RUNNER_TEMP/posthorse-official"
      - name: Qualify fork Pi
        env:
          PI_COMPAT_FORK_REF: ${{ steps.fork.outputs.commit }}
        run: |
          node automation/scripts/qualify.mjs \
            --repo pi-posthorse --source "$GITHUB_WORKSPACE/extension" \
            --host fork --target "$RUNNER_TEMP/fork-package" --output "$RUNNER_TEMP/posthorse-fork"
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-qualification
          path: |
            ${{ runner.temp }}/posthorse-official
            ${{ runner.temp }}/posthorse-fork
          if-no-files-found: error
          retention-days: 3
