name: Pi

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ci.yml
      - index.ts
      - ui.ts
      - package.json
      - package-lock.json
      - tsconfig.json
      - scripts/**
      - test/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-${{ github.ref }}
  cancel-in-progress: true

env:
  PI_AUTOMATION_REF: bfe47007194178fdda46c3fc4a0be32113371d53 # reviewed Pi 0.87.0 automation
  PI_FORK_REF: 8fb7886130ff1fedc415bdd6fea03aef8a8957d8 # reviewed native fork

jobs:
  verify:
    name: Pi fork and official refusal
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: extension
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/.github
          ref: ${{ env.PI_AUTOMATION_REF }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/pi
          ref: ${{ env.PI_FORK_REF }}
          path: fork
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Use the reviewed npm version
        run: npm install --global "$(node -p 'require("./automation/package.json").packageManager')"
      - name: Install native test prerequisites
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fd-find ripgrep attr
      - name: Build the pinned fork
        working-directory: fork
        run: |
          npm ci --ignore-scripts --no-audit
          npm run hydrate:model-data
          PI_OFFLINE=1 PI_TELEMETRY=0 npm run build:offline
          git diff --exit-code
      - run: npm ci --ignore-scripts --no-audit
        working-directory: extension
      - name: Qualify fork behavior and installation
        run: |
          node automation/scripts/pack-fork.mjs fork "$RUNNER_TEMP/fork-package" "$PI_FORK_REF"
          env -u GITHUB_STEP_SUMMARY PI_COMPAT_FORK_REF="$PI_FORK_REF" node automation/scripts/qualify.mjs \
            --repo pi-posthorse --source "$GITHUB_WORKSPACE/extension" \
            --host fork --target "$RUNNER_TEMP/fork-package" --output "$RUNNER_TEMP/posthorse-fork"
      - name: Verify source-harness integration without credentials
        working-directory: extension
        run: |
          fixture="$(mktemp -d /tmp/posthorse-source.XXXXXX)"
          mkdir -p "$fixture/home" "$fixture/agent" "$fixture/tmp"
          env -i PATH="$PATH" HOME="$fixture/home" TMPDIR="$fixture/tmp" \
            PI_CODING_AGENT_DIR="$fixture/agent" PI_OFFLINE=1 PI_TELEMETRY=0 \
            PI_FORK="$GITHUB_WORKSPACE/fork" bash scripts/integration.sh
      - name: Verify official Pi clearly refuses Posthorse
        run: |
          version="$(node -p 'require("./extension/package.json").devDependencies["@earendil-works/pi-coding-agent"]')"
          env -u GITHUB_STEP_SUMMARY node automation/scripts/qualify.mjs \
            --repo pi-posthorse --source "$GITHUB_WORKSPACE/extension" \
            --host official --target "$version" --output "$RUNNER_TEMP/posthorse-official"
