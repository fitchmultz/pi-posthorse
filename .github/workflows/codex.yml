name: Codex adapter

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/codex.yml
      - 'adapters/codex-posthorse/**'
      - '!adapters/codex-posthorse/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-adapter-${{ github.ref }}
  cancel-in-progress: true

env:
  CODEX_RELEASE: rust-v0.157.1

jobs:
  verify:
    name: Codex stock recovery
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: adapters/codex-posthorse
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          check-latest: true
          package-manager-cache: false
      - name: Lockfile resolves only from the public npm registry
        run: |
          ! grep '"resolved": "' package-lock.json | grep -v '"resolved": "https://registry.npmjs.org/'
      - run: npm ci --ignore-scripts --no-audit
      - run: npm test
      - run: npm audit --omit=dev
      - name: Download the pinned Codex runtime
        run: |
          base="https://github.com/openai/codex/releases/download/$CODEX_RELEASE"
          mkdir -p "$RUNNER_TEMP/codex-runtime"
          curl --fail --location --retry 2 "$base/codex-x86_64-unknown-linux-musl.tar.gz" -o "$RUNNER_TEMP/codex-runtime.tar.gz"
          tar -xzf "$RUNNER_TEMP/codex-runtime.tar.gz" -C "$RUNNER_TEMP/codex-runtime"
          curl --fail --location --retry 2 "$base/codex-code-mode-host-x86_64-unknown-linux-musl.tar.gz" -o "$RUNNER_TEMP/codex-code-mode-host.tar.gz"
          tar -xzf "$RUNNER_TEMP/codex-code-mode-host.tar.gz" -C "$RUNNER_TEMP/codex-runtime"
          mv "$RUNNER_TEMP/codex-runtime/codex-code-mode-host-x86_64-unknown-linux-musl" "$RUNNER_TEMP/codex-runtime/codex-code-mode-host"
      - name: Verify ordinary compaction and stock recovery hooks
        env:
          POSTHORSE_CODEX_BIN: ${{ runner.temp }}/codex-runtime/codex-x86_64-unknown-linux-musl
        run: npm run test:stock
