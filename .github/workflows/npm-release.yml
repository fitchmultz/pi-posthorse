name: npm release

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  plan:
    permissions:
      contents: write
    if: vars.NPM_RELEASE_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.repository_owner == 'fitchmultz'
    uses: fitchmultz/.github/.github/workflows/npm-release-plan.yml@67c470e53fed794c2abbc444069792ff494b6f6c # main
    with:
      automation-ref: 67c470e53fed794c2abbc444069792ff494b6f6c # main

  checks:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      official-version: ${{ needs.plan.outputs.official-version }}
      fork-ref: ${{ needs.plan.outputs.fork-ref }}

  publish:
    needs: [plan, checks]
    if: needs.plan.outputs.release == 'true'
    permissions:
      contents: write
      id-token: write
    uses: fitchmultz/.github/.github/workflows/npm-release.yml@67c470e53fed794c2abbc444069792ff494b6f6c # main
    with:
      automation-ref: 67c470e53fed794c2abbc444069792ff494b6f6c # main
      source-ref: ${{ needs.plan.outputs.source }}
      official-version: ${{ needs.plan.outputs.official-version }}
      fork-ref: ${{ needs.plan.outputs.fork-ref }}
