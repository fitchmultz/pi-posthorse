name: npm version

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [npm release]
    types: [completed]
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:
    inputs:
      supersede-version:
        description: Failed unpublished automatic version
        required: false
        type: string
        default: ""
      supersede-source:
        description: Failed automatic version commit SHA
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: write

concurrency:
  group: npm-version-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  reconcile:
    if: >-
      vars.NPM_RELEASE_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      github.repository_owner == 'fitchmultz' &&
      (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release): ')) &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.event != 'push' ||
        startsWith(github.event.workflow_run.head_commit.message, 'chore(release): '))
    uses: fitchmultz/.github/.github/workflows/npm-release-bump.yml@3e744f52412c3669bd781ed5ea3e21567798352e # main
    with:
      automation-ref: 3e744f52412c3669bd781ed5ea3e21567798352e # main
      app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
      package-qualified: true
      supersede-version: ${{ inputs.supersede-version || '' }}
      supersede-source: ${{ inputs.supersede-source || '' }}
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
