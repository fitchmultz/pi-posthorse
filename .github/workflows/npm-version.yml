name: npm version

on:
  push:
    branches: [main]
  check_run:
    types: [completed]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [npm release]
    types: [completed]
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: write

concurrency:
  group: npm-version-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  reconcile:
    if: >-
      vars.NPM_RELEASE_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      github.repository_owner == 'fitchmultz' &&
      (github.event_name != 'check_run' ||
        ((github.event.check_run.app.slug == 'pi-durable' || github.event.check_run.app.slug == 'cursor') &&
          startsWith(github.event.check_run.check_suite.head_branch, 'npm-version/'))) &&
      (github.event_name != 'issue_comment' ||
        (github.event.issue.pull_request != null && github.event.issue.user.login == 'pi-durable[bot]')) &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.event != 'push' ||
        startsWith(github.event.workflow_run.head_commit.message, 'chore(release): '))
    uses: fitchmultz/.github/.github/workflows/npm-release-bump.yml@85d05a42febdf1418bfa8b42842a8485aade10c1 # main
    with:
      automation-ref: 85d05a42febdf1418bfa8b42842a8485aade10c1 # main
      app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
      package-qualified: true
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      PI_DURABLE_ACCESS_TOKEN: ${{ secrets.PI_DURABLE_ACCESS_TOKEN }}
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
