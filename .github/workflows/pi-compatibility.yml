name: Pi compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    uses: fitchmultz/.github/.github/workflows/pi-compatibility.yml@1eb543e968887839de4f2966193a6c5b46967e11 # v1.0.0
    with:
      automation-ref: 1eb543e968887839de4f2966193a6c5b46967e11 # v1.0.0
