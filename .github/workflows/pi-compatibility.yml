name: Pi compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    uses: fitchmultz/.github/.github/workflows/pi-compatibility.yml@6e183d51cb45b68839a7141402cc347a90e999bb # v1.0.0
    with:
      automation-ref: 6e183d51cb45b68839a7141402cc347a90e999bb # v1.0.0
