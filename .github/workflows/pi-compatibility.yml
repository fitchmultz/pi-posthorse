name: Pi compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    uses: fitchmultz/.github/.github/workflows/pi-compatibility.yml@bfe47007194178fdda46c3fc4a0be32113371d53 # reviewed Pi 0.87.0 fork
    with:
      automation-ref: bfe47007194178fdda46c3fc4a0be32113371d53 # reviewed Pi 0.87.0 fork
