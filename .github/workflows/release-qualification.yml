name: Release qualification

on:
  workflow_call:
    inputs:
      source-ref:
        description: Exact candidate commit to qualify
        required: true
        type: string

permissions:
  contents: read

jobs:
  quality:
    name: Strict code quality
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Use job-private compilation cache and fixture evidence
        run: |
          {
            printf 'npm_config_cache=%s/npm-cache\n' "$RUNNER_TEMP"
            printf 'PI_COMPAT_EVIDENCE_DIR=%s/posthorse-evidence\n' "$RUNNER_TEMP"
            printf 'PI_RELEASE_QUALITY_EVIDENCE=%s/posthorse-evidence/release-controls\n' "$RUNNER_TEMP"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-ref }}
          persist-credentials: false
      - name: Verify candidate source
        env:
          SOURCE_REF: ${{ inputs.source-ref }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
          printf 'Qualified source: %s\n' "$SOURCE_REF"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          check-latest: true
          package-manager-cache: false
      - name: Use the repository npm version
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci --ignore-scripts --no-audit
      - name: Install native test prerequisites
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fd-find ripgrep attr
      - run: npm run verify
      - name: Prove release quality controls
        run: bash scripts/release-quality-controls.sh
      - name: Hash retained native fixtures
        if: always()
        run: |
          if test -d "$PI_COMPAT_EVIDENCE_DIR"; then
            cd "$PI_COMPAT_EVIDENCE_DIR"
            find . -type f ! -path './fixture-sha256sums.txt' -print0 | sort -z | xargs -0 -r sha256sum > fixture-sha256sums.txt
          fi
      - name: Retain strict quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strict-quality-fixtures
          path: ${{ runner.temp }}/posthorse-evidence
          if-no-files-found: error
          retention-days: 3
