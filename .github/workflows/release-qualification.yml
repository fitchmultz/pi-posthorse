name: Release qualification

on:
  workflow_call:
    inputs:
      source-ref:
        description: Exact candidate commit to qualify
        required: true
        type: string

permissions:
  contents: read

jobs:
  quality:
    name: Strict code quality
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Use job-private compilation cache and fixture evidence
        run: |
          {
            printf 'npm_config_cache=%s/npm-cache\n' "$RUNNER_TEMP"
            printf 'PI_COMPAT_EVIDENCE_DIR=%s/posthorse-evidence\n' "$RUNNER_TEMP"
            printf 'PI_RELEASE_QUALITY_EVIDENCE=%s/posthorse-evidence/release-controls\n' "$RUNNER_TEMP"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-ref }}
          persist-credentials: false
      - name: Verify candidate source
        env:
          SOURCE_REF: ${{ inputs.source-ref }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
          printf 'Qualified source: %s\n' "$SOURCE_REF"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          check-latest: true
          package-manager-cache: false
      - name: Use the repository npm version
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci --ignore-scripts --no-audit
      - name: Read native compiler versions from CI
        id: compilers
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFileSync } from "node:fs";
          import { parse } from "yaml";
          const { env } = parse(readFileSync(".github/workflows/ci.yml", "utf8"));
          for (const [name, value] of Object.entries({ go: env.GO_VERSION, rust: env.RUST_TOOLCHAIN })) {
            if (typeof value !== "string" || /[\r\n]/.test(value)) throw new Error(`Invalid ${name} toolchain`);
            process.stdout.write(`${name}=${value}\n`);
          }
          NODE
      # Keys cover every preparation fingerprint input plus the pinned compiler.
      - name: Restore corrected native Oxlint
        id: oxlint
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/npm-cache/pi-quality-engine/oxlint
          key: oxlint-${{ runner.os }}-${{ runner.arch }}-rust-${{ steps.compilers.outputs.rust }}-${{ hashFiles('patches/oxlint-*.patch', 'scripts/setup-oxlint-engine.ts') }}
      - name: Restore corrected tsgolint
        id: tsgolint
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/npm-cache/pi-quality-engine/tsgolint
          key: tsgolint-${{ runner.os }}-${{ runner.arch }}-go-${{ steps.compilers.outputs.go }}-${{ hashFiles('patches/tsgolint-*.patch', 'scripts/setup-quality-engine.ts') }}
      - if: steps.tsgolint.outputs.cache-hit != 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ steps.compilers.outputs.go }}
          cache: false
      - if: steps.oxlint.outputs.cache-hit != 'true'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: ${{ steps.compilers.outputs.rust }}
          components: llvm-tools
          cache: false
          override: true
          rustflags: ""
      - name: Install native test prerequisites
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fd-find ripgrep attr
      - run: npm run quality:prepare
      # Save before acceptance so a failing test does not discard a completed native build.
      - if: steps.oxlint.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/npm-cache/pi-quality-engine/oxlint
          key: ${{ steps.oxlint.outputs.cache-primary-key }}
      - if: steps.tsgolint.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/npm-cache/pi-quality-engine/tsgolint
          key: ${{ steps.tsgolint.outputs.cache-primary-key }}
      - run: npm run verify
      - name: Prove release quality controls
        run: bash scripts/release-quality-controls.sh
      - name: Hash retained native fixtures
        if: always()
        run: |
          if test -d "$PI_COMPAT_EVIDENCE_DIR"; then
            cd "$PI_COMPAT_EVIDENCE_DIR"
            find . -type f ! -path './fixture-sha256sums.txt' -print0 | sort -z | xargs -0 -r sha256sum > fixture-sha256sums.txt
          fi
      - name: Retain strict quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strict-quality-fixtures
          path: ${{ runner.temp }}/posthorse-evidence
          if-no-files-found: error
          retention-days: 3
